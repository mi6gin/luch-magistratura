services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    environment:
      ML_PYTHON: python3
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan rayventory:setup && php artisan serve --host=0.0.0.0 --port=8000"
