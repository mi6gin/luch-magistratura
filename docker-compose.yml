services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    environment:
      ML_PYTHON: python3
      QUEUE_CONNECTION: database
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan rayventory:setup && php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD", "php", "artisan", "migrate:status"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: .
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    environment:
      ML_PYTHON: python3
      QUEUE_CONNECTION: database
    depends_on:
      app:
        condition: service_healthy
    command: php artisan queue:work --sleep=2 --tries=1 --timeout=3600
